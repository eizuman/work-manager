<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Work Manager</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="app-page">

    <!-- Desktop Sidebar -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo">
            <div class="sidebar-logo-icon">
                <svg width="28" height="28" viewBox="0 0 52 52" fill="none">
                    <path d="M26 6L17 22h5L13 40h26L30 22h5L26 6Z" fill="#7DB564"/>
                    <rect x="23" y="40" width="6" height="6" rx="1" fill="#6A9E54"/>
                </svg>
            </div>
            <div class="sidebar-logo-text">
                <div class="sidebar-logo-title">Work Manager</div>
            </div>
        </div>

        <div class="sidebar-object" id="sidebar-object">
            <div class="sidebar-object-label">Объект</div>
            <div class="sidebar-object-name" id="sidebar-object-name">—</div>
            <button class="sidebar-object-switch" id="sidebar-object-switch">
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
                Сменить объект
            </button>
        </div>

        <nav class="sidebar-nav" id="sidebar-nav">
            <button class="sidebar-nav-item active" data-module="calendar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                Календарь
            </button>
            <button class="sidebar-nav-item" data-module="finance">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="12" cy="16" r="2"/></svg>
                Финансы
            </button>
            <button class="sidebar-nav-item" data-module="tasks">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                Задачи
            </button>
            <button class="sidebar-nav-item" data-module="purchases">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
                Закупки
            </button>
            <button class="sidebar-nav-item" data-module="stats">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
                Статистика
            </button>
        </nav>

        <div class="sidebar-footer">
            <button class="sidebar-nav-item sidebar-settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Настройки
            </button>
        </div>
    </aside>

    <!-- Main content wrapper -->
    <div class="app-content" id="app-content">

        <!-- App Header -->
        <header class="app-header" id="app-header">
            <button class="icon-btn header-menu-btn" id="menu-btn" aria-label="Menu">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <h1 class="header-title" id="header-title">Календарь</h1>
            <button class="header-object-btn" id="header-object-btn" title="Сменить объект">
                <span id="header-object-name">—</span>
                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
        </header>

        <!-- Module containers -->
        <main class="app-main" id="app-main">
            <div id="module-calendar" class="module hidden"></div>
            <div id="module-finance" class="module hidden"></div>
            <div id="module-tasks" class="module hidden"></div>
            <div id="module-purchases" class="module hidden"></div>
            <div id="module-stats" class="module hidden"></div>
        </main>

    </div><!-- /.app-content -->

    <!-- Bottom Navigation (mobile only) -->
    <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-item active" data-module="calendar">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
            <span>Календарь</span>
        </button>
        <button class="nav-item" data-module="finance">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><circle cx="12" cy="16" r="2"/></svg>
            <span>Финансы</span>
        </button>
        <button class="nav-item" data-module="tasks">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span>Задачи</span>
        </button>
        <button class="nav-item" data-module="purchases">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <span>Закупки</span>
        </button>
        <button class="nav-item" data-module="stats">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>Статистика</span>
        </button>
    </nav>

    <!-- Bottom Sheet -->
    <div id="bs-overlay" class="bs-overlay hidden" role="dialog"></div>
    <div id="bottom-sheet" class="bottom-sheet" aria-hidden="true">
        <div class="bs-handle"></div>
        <div id="bs-content" class="bs-content"></div>
    </div>

    <!-- Confirm Dialog -->
    <div id="dialog-overlay" class="dialog-overlay hidden">
        <div class="dialog">
            <p id="dialog-message" class="dialog-message"></p>
            <div class="dialog-actions">
                <button id="dialog-cancel" class="btn btn-outline">Отмена</button>
                <button id="dialog-confirm" class="btn btn-danger">Удалить</button>
            </div>
        </div>
    </div>

    <!-- Session Re-authentication Overlay -->
    <div id="session-expired-overlay" class="session-expired-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="session-expired-title">
        <div class="session-expired-card">
            <h2 id="session-expired-title" class="session-expired-title">Сессия истекла</h2>
            <p class="session-expired-text">Войдите снова, чтобы сохранить изменения. Введённые данные останутся в форме.</p>
            <p id="session-expired-error" class="session-expired-error hidden"></p>
            <button id="session-reauth-btn" class="google-btn session-reauth-btn">Войти снова через Google</button>
        </div>
    </div>

    <!-- Object Select Overlay -->
    <div id="object-select-overlay" class="object-select-overlay hidden">
        <div class="object-select-card">
            <div class="object-select-logo-icon">
                <svg width="26" height="26" viewBox="0 0 52 52" fill="none">
                    <path d="M26 6L17 22h5L13 40h26L30 22h5L26 6Z" fill="#7DB564"/>
                    <rect x="23" y="40" width="6" height="6" rx="1" fill="#6A9E54"/>
                </svg>
            </div>
            <h2 class="object-select-title" id="object-select-title">Выберите объект</h2>
            <div id="object-select-list" class="object-select-list"></div>
            <div id="object-add-form" class="object-add-form hidden">
                <input type="text" class="form-control" id="new-object-name" placeholder="Название объекта" autocomplete="off" style="margin-bottom:10px">
                <label class="object-existing-toggle" style="margin-bottom:8px">
                    <input type="checkbox" id="new-object-use-existing">
                    <span>Использовать существующую таблицу</span>
                </label>
                <input type="text" class="form-control" id="new-object-sheetid" placeholder="Google Sheet ID" autocomplete="off" style="display:none;margin-bottom:14px">
                <button class="btn btn-primary" id="new-object-save-btn" style="margin-bottom:8px">Создать объект</button>
                <button class="btn btn-outline" id="new-object-cancel-btn">Отмена</button>
            </div>
            <button id="object-select-add-btn" class="btn btn-outline object-select-add-btn">+ Добавить объект</button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast hidden"></div>

    <!-- Global Loading -->
    <div id="loading-overlay" class="loading-overlay hidden">
        <div class="spinner"></div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/sheets.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/finance.js"></script>
    <script src="js/tasks.js"></script>
    <script src="js/purchases.js"></script>
    <script src="js/stats.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
